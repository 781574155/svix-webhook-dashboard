server {
    listen       80;
    server_name  _;
    server_tokens off;
    auth_basic "Svix Webhook Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        root   /work/html;
        index  index.html index.htm;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
